apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Values.namespace }}-ingress" # Added quotes
  namespace: "{{ .Values.namespace }}"    # Added quotes
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: "{{ .Values.frontend.ingress.host }}" # Added quotes
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: {{ .Values.frontend.service.port }}