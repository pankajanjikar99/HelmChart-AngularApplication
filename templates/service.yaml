apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: "{{ .Values.namespace }}" # Added quotes
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.target.port }}
  type: NodePort # Changed from ClusterIP for easier local access